<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funkcje</title>
</head>
<body>

<script>
    // Zad. 1
    // Napisz funkcję add(a, b), która zwróci sumę dwóch liczb.
    function add(a, b) {
        let wynik = a + b;
        return wynik;
    }
    console.log("Zad. 1:", add(10, 20));

    // Zad. 2
    // Napisz funkcję greet(name, surname), która zwróci tekst:
    // "Twoje imię to "przekazane imię", a nazwisko (przekazane nazwisko)".
    function greet(name, surname) {
        const nazwisko = `Twoje imie to ${name}, a nazwisko ${surname}`;
        return nazwisko;
    }
    console.log("Zad. 2:", greet("Jan", "Kowalski"));

    // Zad. 3
    // Stwórz funkcję concat(text1, text2), która zwróci połączony napis.
    function concat(text1, text2) {
        let polaczenie = text1 + text2;
        return polaczenie;
    }
    console.log("Zad. 3:", concat("jeden", "dwa"));

    // Zad. 4
    // Napisz funkcję absoluteValue(x), która zwraca wartość bezwzględną.
    // Skorzystaj z Math.abs().
    function absoluteValue(x) {
        let wartosc_bezwzgledna = Math.abs(x);
        return wartosc_bezwzgledna;
    }
    console.log("Zad. 4:", absoluteValue(-5));

    // Zad. 5
    // Napisz funkcję showFutureAge(name, currentAge, years=10),
    // która zwróci np. "Andrzej za 10 lat będzie miał X lat".
    function showFutureAge(name1, currentAge, years = 10) {
        let wynik_docelowy = currentAge + years;
        const napis = `${name1} za ${years} lat będzie miał ${wynik_docelowy} lat`;
        return napis;
    }
    console.log("Zad. 5:", showFutureAge("Andrzej", 23));

    // Zad. 6
    // Napisz funkcję rectangleArea(length, width),
    // która obliczy pole prostokąta.
    function rectangleArea(length, width) {
        let pole = length * width;
        return pole;
    }
    console.log("Zad. 6:", rectangleArea(100, 100));

    // Zad. 7
    // Napisz funkcję power(a, b), która zwraca a do potęgi b.
    // Skorzystaj z Math.pow().
    function power(a, b) {
        let wynik = Math.pow(a, b);
        return wynik;
    }
    console.log("Zad. 7:", power(2, 3));

    // Zad. 8
    // Napisz funkcję squareRoot(x), która zwróci pierwiastek kwadratowy z x.
    // Skorzystaj z Math.sqrt().
    function squareRoot(x) {
        let wynik = Math.sqrt(x);
        return wynik;
    }
    console.log("Zad. 8:", squareRoot(4));

    // Zad. 9
    // Napisz funkcję roundNumber(x),
    // która zwróci trzy wartości: Math.floor(x), Math.ceil(x), Math.round(x).
    function roundNumber(x) {
        let zaokraglenie1 = Math.round(x);
        let zaokraglenie2 = Math.floor(x);
        let zaokraglenie3 = Math.ceil(x);
        return [zaokraglenie1, zaokraglenie2, zaokraglenie3];
    }
    console.log("Zad. 9:", roundNumber(4.7));

    // Zad. 10
    // Napisz funkcję random1to10(),
    // która zwróci losową liczbę całkowitą z zakresu 1–10.
    function random1to10() {
        let min = 1;
        let max = 10;
        let random = Math.floor(Math.random() * (max - min + 1)) + min;
        return random;
    }
    console.log("Zad. 10:", random1to10());

    // Zad. 11
    // Napisz funkcję maxOfTwo(a, b), która zwróci większą liczbę.
    function maxOfTwo(a, b) {
        if (a > b) {
            return a;
        } else {
            return b;
        }
    }
    console.log("Zad. 11:", maxOfTwo(1, 5));

    // Zad. 12
    // Napisz funkcję minOfTwo(a, b), która zwróci mniejszą liczbę.
    function minOfTwo(a, b) {
        if (a < b) {
            return a;
        } else {
            return b;
        }
    }
    console.log("Zad. 12:", minOfTwo(1, 5));

    // Zad. 13
    // Napisz funkcję circleArea(r), która oblicza pole koła.
    // Skorzystaj z Math.PI i Math.pow().
    function circleArea(r) {
        let pole = Math.PI * Math.pow(r, 2);
        return pole;
    }
    console.log("Zad. 13:", circleArea(4));

    // Zad. 14
    // Napisz funkcję isAdult(age),
    // która zwróci true, jeśli wiek >= 18, w przeciwnym razie false.
    // Skorzystaj z Boolean().
    function isAdult(age) {
        if (age >= 18) {
            return true;
        } else {
            return false;
        }
    }
    console.log("Zad. 14:", isAdult(4));

    // Zad. 15
    // Napisz funkcję isEmptyString(text),
    // która zwróci true, jeśli tekst jest pusty (""), w przeciwnym razie false.
    function isEmptyString(text) {
        if (text === "") {
            return true;
        } else {
            return false;
        }
    }
    console.log("Zad. 15:", isEmptyString(""));

    // Zad. 16
    // Napisz funkcję convertToNumber(value),
    // która użyje Number(value) i zwróci wynik.
    // Przetestuj np. "123", "123abc", true, false.
    function convertToNumber(value) {
        return Number(value);
    }
    console.log("Zad. 16 (\"123\"): ", convertToNumber("123"));   
    console.log("Zad. 16 (\"123abc\"): ", convertToNumber("123abc")); 
    console.log("Zad. 16 (true): ", convertToNumber(true));    
    console.log("Zad. 16 (false): ", convertToNumber(false));

    // Zad. 17
    // Napisz funkcję parseNumbers(),
    // która sparsuje stringi "123.45" (parseFloat) i "123abc" (parseInt).
    // Zwróć oba wyniki.
    function parseNumbers() {
        let floatVal = parseFloat("123.45");
        let intVal = parseInt("123abc");
        return { floatVal, intVal }; 
    }
    console.log("Zad. 17:", parseNumbers());

    // Zad. 18
    // Napisz funkcję getCurrentYear(),
    // która zwróci aktualny rok.
    function getCurrentYear() {
        let data = new Date().getFullYear();
        return data;
    }
    console.log("Zad. 18:", getCurrentYear());

    // Zad. 19
    // Napisz funkcję getCurrentMonth(),
    // która zwróci aktualny miesiąc (1–12).
    function getCurrentMonth() {
        let data = new Date();
        return data.getMonth() +1;
    }
    console.log("Zad. 19:", getCurrentMonth());

    // Zad. 20
    // Napisz funkcję getCurrentDayOfWeek(),
    // która zwróci dzień tygodnia (0 = niedziela, 1 = poniedziałek...).
    function getCurrentDayOfWeek() {
        let data = new Date();
        return data.getDay();
    }
    console.log("Zad. 20:", getCurrentDayOfWeek());

    // Zad. 21
    // Napisz funkcję formatDate(),
    // która zwróci datę w formacie "DD-MM-YYYY". 
    function formatDate() {
        let now = new Date();
        let day = String(now.getDate()).padStart(2, '0');
        let month = String(getCurrentMonth()).padStart(2, '0');
        let year = String(now.getFullYear());
        return `${day}-${month}-${year}`;
    }
    console.log("Zad. 21:", formatDate());

    // Zad. 22
    // Napisz funkcję daysBetween(date1, date2),
    // która obliczy różnicę w dniach między dwiema datami.
    // Podpowiedź: getTime() i podziel milisekundy przez (1000*60*60*24).
    function daysBetween(date1, date2) {
        let d1 = new Date(date1);
        let d2 = new Date(date2);
        let czasMI = Math.abs(d2.getTime() - d1.getTime());
        let czasDay = czasMI / (1000 * 60 * 60 * 24);
        return Math.round(czasDay);
    }
    console.log("Zad. 22:", daysBetween('2026-09-01', '1955-05-14'));
</script>
</body>
</html>
